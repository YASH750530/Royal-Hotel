<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Hotel | Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="login-section">

        <div class="login-box">

            <h1>Royal Hotel</h1>

            <h2>Admin Login</h2>

            <p>Login to manage hotel bookings</p>

            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>

                <button type="submit">
                    Login
                </button>

                <p id="login-message"></p>

            </form>

        </div>

    </section>


    <script src="login.js"></script>

</body>

</html>
